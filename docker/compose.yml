services:
  postgres:
    image: postgres:17
    container_name: engineering-workspace-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: engineering
      POSTGRES_PASSWORD: engineering_dev
      POSTGRES_DB: engineering_workspace

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: